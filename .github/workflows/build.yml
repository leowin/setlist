name: Build

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Audio core tests (C++)
        run: cmake -S audio -B build/audio -DCMAKE_BUILD_TYPE=Release && cmake --build build/audio && ctest --test-dir build/audio --output-on-failure
      - run: ./gradlew :shared:testDebugUnitTest :androidApp:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: setlist-apk
          path: androidApp/build/outputs/apk/release/androidApp-release.apk

  ios-framework:
    # Compiles the shared Kotlin module for iOS; the app itself is built with Xcode (see iosApp/README.md).
    # macOS runners are not available for this repository's plan, so this job runs only on manual dispatch.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
