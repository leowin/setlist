name: Build

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # Release signing from repository secrets; empty → the APK is signed with the runner's debug key.
      KEYSTORE_BASE64: ${{ secrets.SETLIST_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Audio core tests (C++)
        run: cmake -S audio -B build/audio -DCMAKE_BUILD_TYPE=Release && cmake --build build/audio && ctest --test-dir build/audio --output-on-failure
      - name: Release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/setlist-release.jks"
          echo "SETLIST_KEYSTORE=$RUNNER_TEMP/setlist-release.jks" >> "$GITHUB_ENV"
      - run: ./gradlew :shared:testDebugUnitTest :server:test :androidApp:assembleRelease
        env:
          SETLIST_KEYSTORE_PASSWORD: ${{ secrets.SETLIST_KEYSTORE_PASSWORD }}
          SETLIST_KEY_ALIAS: setlist
          ORG_GRADLE_PROJECT_setlistAppLinkHost: ${{ vars.SETLIST_APP_LINK_HOST }}
      - uses: actions/upload-artifact@v4
        with:
          name: setlist-apk
          path: androidApp/build/outputs/apk/release/androidApp-release.apk

  ios-framework:
    # Compiles the shared Kotlin module for iOS; the app itself is built with Xcode (see iosApp/README.md).
    # macOS runners are not available for this repository's plan, so this job runs only on manual dispatch.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
